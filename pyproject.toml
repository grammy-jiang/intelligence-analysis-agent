[project]
name = "intelligence-analysis-agent"
version = "0.3.0"
description = "Intelligence-analysis agent — MCP state + OSINT layer (calibration-tracker, evidence-ledger, ach-engine, osint-toolkit)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["mcp_servers*"]
