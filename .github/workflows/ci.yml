name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run all hooks (ruff, markdownlint, Mermaid, hygiene)
        run: pre-commit run --all-files --show-diff-on-failure

  egress-isolation:
    name: Egress isolation (data servers stay network-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Assert the data servers import no network modules
        run: python scripts/check_egress_isolation.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # 3.14 is exercised but allowed to fail until every dependency ships 3.14 wheels;
    # promote it to a required version by dropping `experimental` once it is green.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (latest deps — fastmcp 3.x)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest -q --cov=mcp_servers --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Per-module coverage gate (core >= 95%, others >= 90%)
        run: python scripts/check_coverage.py
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false # keep CI green even if the upload/token is not set up yet
          token: ${{ secrets.CODECOV_TOKEN }} # optional; public-repo upload also works tokenless
