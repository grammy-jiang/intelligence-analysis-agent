name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so a job never depends on the GitHub "latest release" API (an outage there
          # failed a run); bump deliberately. Keep in sync with the local uv used for uv.lock.
          version: "0.9.10"
          enable-cache: true
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run hooks (ruff, markdownlint, hygiene; Mermaid has its own job)
        env:
          SKIP: mermaid-compile # needs Node + a browser — see the `mermaid` job
        run: uvx pre-commit run --all-files --show-diff-on-failure

  egress-isolation:
    name: Egress isolation (data servers stay network-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so a job never depends on the GitHub "latest release" API (an outage there
          # failed a run); bump deliberately. Keep in sync with the local uv used for uv.lock.
          version: "0.9.10"
          enable-cache: true
      - name: Sync (locked) + assert the data servers import no network modules
        run: |
          uv sync --frozen
          uv run python scripts/check_egress_isolation.py

  mermaid:
    name: Mermaid diagrams compile (mermaid-cli)
    runs-on: ubuntu-latest
    env:
      # Pinned so the Puppeteer browser-cache key is stable; bump to refresh the browser.
      MERMAID_CLI_VERSION: "11.16.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Cache the Puppeteer/Chromium download
        uses: actions/cache@v6
        with:
          # mermaid-cli's Puppeteer downloads Chromium here on install; on a cache
          # hit the postinstall finds it and skips the ~hundreds-of-MB download.
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-mermaid-cli-${{ env.MERMAID_CLI_VERSION }}
      - name: Install mermaid-cli
        run: npm install -g "@mermaid-js/mermaid-cli@${MERMAID_CLI_VERSION}"
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so a job never depends on the GitHub "latest release" API (an outage there
          # failed a run); bump deliberately. Keep in sync with the local uv used for uv.lock.
          version: "0.9.10"
          enable-cache: true
      - name: Compile every fenced Mermaid block
        run: uv run --no-project python scripts/check_mermaid.py $(git ls-files '*.md')

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned so a job never depends on the GitHub "latest release" API (an outage there
          # failed a run); bump deliberately. Keep in sync with the local uv used for uv.lock.
          version: "0.9.10"
          enable-cache: true
      - name: Sync the locked environment (fastmcp 3.x) for this Python
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run pytest -q --cov=mcp_servers --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Per-module coverage gate (core >= 95%, others >= 90%)
        run: uv run python scripts/check_coverage.py
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false # keep CI green even if the upload/token is not set up yet
          token: ${{ secrets.CODECOV_TOKEN }} # optional; public-repo upload also works tokenless
